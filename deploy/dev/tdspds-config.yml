TeamDetails:
  TeamName: tdspds
  PodName: tdspds

Model:
  ProjectName: "CV Model Bias Monitoring"
  ModelName: cv-image-classifier
  ModelVersion: v1
  ModelAlias: dev
  ModelType: computer_vision  # Options: computer_vision, tabular

Schedule:
  Enable: False
  Cron: cron(45 * * 1 ? 2024)  #example expression

# CV Model Configuration
CVModel:
  Architecture: resnet18  # Options: resnet18, resnet34, resnet50, efficientnet_b0, mobilenet_v2
  Pretrained: true
  NumClasses: 2
  ImageSize: 224
  
# S3 Output Configuration for Clarify Integration
S3Output:
  Bucket: tdsp-ml-products-dev
  Prefix: tdspds/cv-model/image-classifier
  ClarifyArtifactsPrefix: tdspds/cv-model/clarify-artifacts

# Clarify Bias Monitoring Configuration
ClarifyConfig:
  Enable: true
  # Sensitive attributes for bias analysis (columns in metadata)
  SensitiveAttributes:
    - age_group
    - gender
    - ethnicity
  # Bias metrics to compute
  BiasMetrics:
    - DPPL   # Difference in Positive Proportions in Predicted Labels
    - DI     # Disparate Impact
    - AD     # Accuracy Difference
    - RD     # Recall Difference
    - DAR    # Difference in Acceptance Rates
    - DRR    # Difference in Rejection Rates
  # Threshold for flagging bias
  BiasThreshold: 0.1
  # Positive label values for binary classification
  PositiveLabelValues: [1]

CostTags:
  cost-layer: sagemaker-train
  cost-misc: NA
  cost-project: mlops-framework
  cost-team: tdspds
  cost-email: pooja.kangokar@toyota.com
  app-id: APM0004570
  app-name: Toyota Data Science Platform
  blueprint-sources: NA
  created-by-email: pooja.kangokar@toyota.com
  program-name: mlops
  cost-bu: DATA
  cost-model: mlops

ModelMonitoring:
  Enable: true
  BiasMonitoring: true
