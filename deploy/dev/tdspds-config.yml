TeamDetails:
  TeamName: tdspds
  PodName: tdspds

Model:
  ProjectName: "Rust Detection"
  ModelName: rust-detection-model
  ModelVersion: v1
  ModelAlias: dev
  ModelType: computer_vision

Schedule:
  Enable: False
  Cron: cron(45 * * 1 ? 2024)

# Feature Store - Not used for CV models (images loaded directly from S3)
# Uncomment for tabular models that use Feature Store
# FeatureStore:
#   FeatureGroupName: "arn:aws:sagemaker:us-east-1:521103921695:feature-group/tdspds-churn-feature-group-26-08-41-28"
#   FeatureStoreRoleARN: "arn:aws:iam::521103921695:role/tdsp-tdspds-centralized-feature-store-service-role"
#   FeatureStoreOutputPath: "s3://tdsp-data-products-dev/tdspds/feature-group/churn-project/query-results/"

# CV Model Configuration
CVModel:
  Architecture: resnet18  # Options: resnet18, resnet50, efficientnet_b0
  Pretrained: true
  NumClasses: 2
  ImageSize: 224
  ClassNames:
    - "no_rust"
    - "rust"

# S3 Output - Your monitoring repo reads from this path
S3Output:
  Bucket: tdsp-ml-products-dev
  Prefix: tdspds/rust-detection

CostTags:
  cost-layer: sagemaker-train
  cost-misc: NA
  cost-project: mlops-framework
  cost-team: tdspds
  cost-email: pooja.kangokar@toyota.com
  app-id: APM0004570
  app-name: Toyota Data Science Platform
  blueprint-sources: NA
  created-by-email: pooja.kangokar@toyota.com
  program-name: mlops
  cost-bu: DATA
  cost-model: mlops

ModelMonitoring:
  Enable: true
