Model:
  ProjectName: "Rust Detection"
  ModelName: rust-detection-model
  ModelVersion: v1
  ModelAlias: dev
  ModelType: computer_vision

Schedule:
  Enable: False
  Cron: cron(45 * * 1 ? 2024)

# CV Model Configuration
