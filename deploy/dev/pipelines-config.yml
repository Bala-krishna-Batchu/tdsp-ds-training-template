Training:
  JobName: rust-detection-training
  Entrypoint: 'main_script.sh'
  TrainingScript: 'train_cv.py'
  AlgorithmSpecification:
    TrainingInputMode: File
  OutputDataConfig:
    # This S3 path is used by your monitoring repo for Clarify analysis
    S3OutputPath: s3://tdsp-ml-products-dev/tdspds/rust-detection
  ResourceConfig:
    InstanceCount: 1
    InstanceType: ml.p3.2xlarge  # GPU for CV training
    VolumeSizeInGB: 50
  RetryStrategy:
    MaximumRetryAttempts: 2
  StoppingCondition:
    MaxRuntimeInSeconds: 3600
  # CV Model Hyperparameters
  HyperParameters:
    model_architecture: "resnet18"
    pretrained: "true"
    num_classes: "2"
    batch_size: "32"
    num_epochs: "10"
    learning_rate: "0.001"
  # Data is stored in S3 and SageMaker downloads it to /opt/ml/input/data/
  # 
  # S3 Structure:
  #   s3://tdsp-data-products-dev/tdspds/rust-detection/data/
  #   ├── train/
  #   │   ├── no_rust/*.jpg
  #   │   └── rust/*.jpg
  #   ├── test/
  #   │   ├── no_rust/*.jpg
  #   │   └── rust/*.jpg
  #   └── metadata/
  #       └── metadata.csv
  #
  # SageMaker downloads to:
  #   /opt/ml/input/data/train/     <- train_cv.py reads from here
  #   /opt/ml/input/data/test/      <- train_cv.py reads from here
  #   /opt/ml/input/data/metadata/  <- metadata for bias analysis
  #
  InputDataConfig:
    - ChannelName: "train"
      ContentType: "application/x-image"
      CompressionType: "None"
      DataSource:
        S3DataSource:
          S3DataDistributionType: "FullyReplicated"
          S3DataType: "S3Prefix"
          S3Uri: "s3://tdsp-data-products-dev/tdspds/rust-detection/data/train"
    - ChannelName: "test"
      ContentType: "application/x-image"
      CompressionType: "None"
      DataSource:
        S3DataSource:
          S3DataDistributionType: "FullyReplicated"
          S3DataType: "S3Prefix"
          S3Uri: "s3://tdsp-data-products-dev/tdspds/rust-detection/data/test"
    - ChannelName: "metadata"
      ContentType: "text/csv"
      CompressionType: "None"
      DataSource:
        S3DataSource:
          S3DataDistributionType: "FullyReplicated"
          S3DataType: "S3Prefix"
          S3Uri: "s3://tdsp-data-products-dev/tdspds/rust-detection/data/metadata"

Pipeline:
  ExecuteOnCommit: True
